<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YENZE</title>
    <script>
        // Client-side router - Loads content without changing URL
        (function() {
            const hostname = window.location.hostname;
            const subdomain = hostname.split('.')[0];
            let targetFile = null;

            // Determine which page to load based on hostname and path
            const path = window.location.pathname;

            // If already on a specific HTML file, don't redirect
            if (path.endsWith('.html')) {
                return;
            }

            if (hostname === 'builder.yenze.io' || hostname.includes('vercel.app')) {
                // Builder subdomain - load builder without changing URL
                fetch('/builder.html')
                    .then(response => response.text())
                    .then(html => {
                        document.open();
                        document.write(html);
                        document.close();
                    });
                return;
            } else if (hostname === 'yenze.io' || hostname === 'www.yenze.io') {
                // Main domain - load landing page without changing URL
                fetch('/landing.html')
                    .then(response => response.text())
                    .then(html => {
                        document.open();
                        document.write(html);
                        document.close();
                    });
                return;
            } else if (hostname.includes('.yenze.io') &&
                      subdomain !== 'www' &&
                      subdomain !== 'yenze' &&
                      subdomain !== 'builder') {
                // User subdomain - load their published site
                targetFile = null; // Will use API
                fetch('/api/subdomain')
                    .then(response => {
                        if (response.ok) {
                            return response.text();
                        }
                        throw new Error('Project not found');
                    })
                    .then(html => {
                        document.open();
                        document.write(html);
                        document.close();
                    })
                    .catch(() => {
                        document.open();
                        document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>404 - Site Not Found</title></head><body style="margin:0;padding:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;color:white;text-align:center;"><div><h1 style="font-size:4rem;margin:0 0 1rem 0">404</h1><p style="font-size:1.25rem;margin:0 0 2rem 0">This site hasn\'t been published yet.</p><a href="https://yenze.io" style="display:inline-block;padding:0.75rem 2rem;background:white;color:#667eea;text-decoration:none;border-radius:8px;font-weight:600">Create Your Own Website</a></div></body></html>');
                        document.close();
                    });
                return;
            } else {
                // Custom domain - fetch project content
                targetFile = null;
                fetch(`/api/serve-project?domain=${encodeURIComponent(hostname)}`)
                    .then(response => {
                        if (response.ok) {
                            return response.text();
                        }
                        throw new Error('Domain not configured');
                    })
                    .then(html => {
                        document.open();
                        document.write(html);
                        document.close();
                    })
                    .catch(() => {
                        document.open();
                        document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Domain Not Configured</title></head><body style="margin:0;padding:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;color:white;text-align:center;"><div><h1 style="font-size:3rem;margin:0 0 1rem 0">🌐 Domain Not Configured</h1><p style="font-size:1.25rem;margin:0 0 2rem 0">The domain <strong>' + hostname + '</strong> is not configured.</p><a href="https://builder.yenze.io/dashboard.html" style="display:inline-block;padding:0.75rem 2rem;background:white;color:#667eea;text-decoration:none;border-radius:8px;font-weight:600">Configure Domain</a></div></body></html>');
                        document.close();
                    });
                return;
            }
        })();
    </script>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: white;
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div>Loading...</div>
</body>
</html>

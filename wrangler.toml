name = "yenze-worker"
main = "src/worker.js"
compatibility_date = "2024-01-01"

# Variables de entorno
[vars]
NODE_ENV = "production"

# Compatibilidad con Node.js APIs
node_compat = true

# Disable workers.dev subdomain
workers_dev = false


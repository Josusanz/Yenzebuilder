<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Acme Solutions - Profile</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Theme Config -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#197fe6",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111921",
                        "surface-light": "#ffffff",
                        "surface-dark": "#1a2633",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px" },
                    boxShadow: {
                        'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
                        'glow': '0 0 40px -10px rgba(25, 127, 230, 0.15)',
                    }
                },
            },
        }
    </script>
    <!-- Google Fonts & Material Symbols -->
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .glass-effect {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .btn-hover-effect {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-hover-effect:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark min-h-screen text-slate-900 dark:text-slate-100 flex flex-col items-center overflow-x-hidden">
    <!-- Decorative Background Elements -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary/5 rounded-full blur-[120px]"></div>
        <div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-blue-400/10 rounded-full blur-[100px]"></div>
    </div>

    <!-- Main Content Container -->
    <main class="w-full max-w-[600px] flex flex-col px-6 py-12 md:py-20 gap-10 z-10">
        <!-- Profile Header -->
        <header class="flex flex-col items-center text-center gap-6 animate-fade-in-up">
            <div class="relative group">
                <div class="absolute -inset-1 bg-gradient-to-r from-primary to-blue-300 rounded-full opacity-30 group-hover:opacity-50 blur transition duration-500"></div>
                <div class="relative w-32 h-32 md:w-40 md:h-40 rounded-full overflow-hidden border-4 border-white dark:border-background-dark shadow-soft">
                    <div class="w-full h-full bg-cover bg-center" data-alt="Abstract blue geometric pattern representing corporate technology" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBy0Vun0VRbZv8m6xFiUdDVxxXuGPeB0nB_camsNh6-E6CfMXTgEWG_MWqt9Lfzq1ir9AsFqYftMkOuHcIozaA9Bx7DHDnRBaY2sBPjsMjqp9h2G4OD6LCb93scRe0OEsB2tvV7NpJCY_JnhOFPhr3jhMyNLaFrZ3Wze211-FtTxAn2UpAF27F9pSWZhR07rIzBMf274isreHvnIeMHMWXVZ-TuACjZDvBSmw7IbJLMSbXCtclJdWp4dfz9Z0S1OTjtokTwrPeRMZ8");'>
                    </div>
                </div>
                <div class="absolute bottom-1 right-1 bg-white dark:bg-slate-800 p-1.5 rounded-full shadow-md border border-slate-100 dark:border-slate-700 flex items-center justify-center text-primary" title="Verified Business">
                    <span class="material-symbols-outlined text-[20px] leading-none" style="font-variation-settings: 'FILL' 1;">verified</span>
                </div>
            </div>

            <div class="space-y-2 max-w-sm">
                <h1 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white">Acme Solutions</h1>
                <p class="text-slate-500 dark:text-slate-400 font-medium text-lg leading-relaxed">
                    Enterprise-grade cloud infrastructure for modern startups.
                </p>
                <div class="flex items-center justify-center gap-1.5 text-slate-400 dark:text-slate-500 text-sm font-medium mt-1">
                    <span class="material-symbols-outlined text-[18px]">location_on</span>
                    <span>San Francisco, CA</span>
                </div>
            </div>
        </header>

        <!-- Links Section -->
        <section class="flex flex-col gap-4 w-full">
            <!-- Primary Action -->
            <a class="btn-hover-effect relative w-full group overflow-hidden rounded-full p-[1px] focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 dark:focus:ring-offset-background-dark" href="#">
                <div class="absolute inset-0 bg-gradient-to-r from-primary to-blue-500 opacity-100 transition-opacity"></div>
                <div class="relative h-14 w-full bg-primary flex items-center justify-between px-6 rounded-full">
                    <div class="w-6"></div>
                    <span class="text-white font-bold text-lg tracking-wide">Visit Official Website</span>
                    <span class="material-symbols-outlined text-white/80 group-hover:translate-x-1 transition-transform">arrow_outward</span>
                </div>
            </a>

            <!-- Divider -->
            <div class="h-px w-full bg-slate-200 dark:bg-slate-800 my-2"></div>

            <!-- Secondary Actions -->
            <button class="btn-hover-effect group flex h-14 w-full items-center justify-between rounded-full bg-white dark:bg-surface-dark border border-slate-200 dark:border-slate-700 px-6 text-slate-900 dark:text-white shadow-sm hover:border-primary/50 dark:hover:border-primary/50 transition-colors">
                <span class="bg-blue-50 dark:bg-blue-900/20 p-2 rounded-full text-primary flex items-center justify-center">
                    <span class="material-symbols-outlined text-[20px]">design_services</span>
                </span>
                <span class="font-semibold text-base flex-1 text-center">Explore Our Services</span>
                <span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">chevron_right</span>
            </button>

            <button class="btn-hover-effect group flex h-14 w-full items-center justify-between rounded-full bg-white dark:bg-surface-dark border border-slate-200 dark:border-slate-700 px-6 text-slate-900 dark:text-white shadow-sm hover:border-primary/50 dark:hover:border-primary/50 transition-colors">
                <span class="bg-blue-50 dark:bg-blue-900/20 p-2 rounded-full text-primary flex items-center justify-center">
                    <span class="material-symbols-outlined text-[20px]">folder_open</span>
                </span>
                <span class="font-semibold text-base flex-1 text-center">Read Case Studies</span>
                <span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">chevron_right</span>
            </button>

            <button class="btn-hover-effect group flex h-14 w-full items-center justify-between rounded-full bg-white dark:bg-surface-dark border border-slate-200 dark:border-slate-700 px-6 text-slate-900 dark:text-white shadow-sm hover:border-primary/50 dark:hover:border-primary/50 transition-colors">
                <span class="bg-blue-50 dark:bg-blue-900/20 p-2 rounded-full text-primary flex items-center justify-center">
                    <span class="material-symbols-outlined text-[20px]">bar_chart</span>
                </span>
                <span class="font-semibold text-base flex-1 text-center">Latest Industry Report</span>
                <span class="material-symbols-outlined text-slate-400 group-hover:text-primary transition-colors">chevron_right</span>
            </button>
        </section>

        <!-- Contact Form -->
        <div class="w-full bg-white dark:bg-surface-dark rounded-2xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm">
            <h3 class="text-lg font-bold mb-4 text-center flex items-center justify-center gap-2">
                <span class="material-symbols-outlined">mail</span>
                Get in Touch
            </h3>
            <form id="contactForm" class="flex flex-col gap-4">
                <input
                    type="text"
                    id="name"
                    placeholder="Your Name"
                    required
                    class="w-full px-4 py-3 rounded-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary"
                />
                <input
                    type="email"
                    id="email"
                    placeholder="Your Email"
                    required
                    class="w-full px-4 py-3 rounded-full bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary"
                />
                <textarea
                    id="message"
                    placeholder="Your Message"
                    required
                    rows="4"
                    class="w-full px-4 py-3 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-primary resize-none"
                ></textarea>
                <button
                    type="submit"
                    class="w-full h-12 rounded-full bg-primary text-white font-bold hover:bg-primary/90 transition-all hover:shadow-lg"
                >
                    Send Message
                </button>
            </form>
            <p id="formMessage" class="mt-3 text-sm text-center hidden"></p>
        </div>

        <!-- Footer -->
        <footer class="mt-auto flex flex-col items-center gap-6">
            <div class="flex items-center gap-4">
                <a aria-label="LinkedIn" class="p-3 rounded-full bg-white dark:bg-surface-dark text-slate-600 dark:text-slate-400 hover:text-primary hover:scale-110 transition-all shadow-sm border border-slate-100 dark:border-slate-700" href="#">
                    <span class="material-symbols-outlined block">group</span>
                </a>
                <a aria-label="Twitter/X" class="p-3 rounded-full bg-white dark:bg-surface-dark text-slate-600 dark:text-slate-400 hover:text-primary hover:scale-110 transition-all shadow-sm border border-slate-100 dark:border-slate-700" href="#">
                    <span class="material-symbols-outlined block">public</span>
                </a>
                <a aria-label="Instagram" class="p-3 rounded-full bg-white dark:bg-surface-dark text-slate-600 dark:text-slate-400 hover:text-primary hover:scale-110 transition-all shadow-sm border border-slate-100 dark:border-slate-700" href="#">
                    <span class="material-symbols-outlined block">photo_camera</span>
                </a>
            </div>

            <div class="text-center">
                <p class="text-slate-400 dark:text-slate-500 text-sm font-medium">© 2024 Acme Solutions Inc.</p>
                <div class="flex justify-center gap-4 mt-2 text-xs text-slate-400 dark:text-slate-600">
                    <a class="hover:underline" href="#">Privacy Policy</a>
                    <a class="hover:underline" href="#">Terms of Service</a>
                </div>
            </div>
        </footer>
    </main>

    <script>
        // Contact Form Integration with YENZE API
        document.getElementById('contactForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const formMessage = document.getElementById('formMessage');
            const submitButton = e.target.querySelector('button[type="submit"]');
            const originalButtonText = submitButton.textContent;

            submitButton.disabled = true;
            submitButton.textContent = 'Sending...';
            formMessage.className = 'mt-3 text-sm text-center hidden';

            const formData = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                subject: 'Business Inquiry - Acme Solutions',
                message: document.getElementById('message').value,
                site_url: window.location.href
            };

            try {
                const response = await fetch('https://yenze.io/api/submit-form', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (response.ok) {
                    formMessage.textContent = '✓ Message sent successfully! We\'ll get back to you soon.';
                    formMessage.className = 'mt-3 text-sm text-center text-green-600 dark:text-green-400';
                    e.target.reset();
                } else {
                    throw new Error(result.error || 'Failed to send message');
                }
            } catch (error) {
                console.error('Form submission error:', error);
                formMessage.textContent = '✗ Failed to send message. Please try again.';
                formMessage.className = 'mt-3 text-sm text-center text-red-600 dark:text-red-400';
            } finally {
                submitButton.disabled = false;
                submitButton.textContent = originalButtonText;
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }
        .info {
            background: #f0f0f0;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        .error {
            background: #fee;
            color: #c00;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        .success {
            background: #efe;
            color: #060;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>🔍 Dashboard Test Page</h1>

    <div class="info">
        <h3>Test Status</h3>
        <div id="status">Loading...</div>
    </div>

    <div id="results"></div>

    <div>
        <button onclick="testSupabaseConnection()">Test Supabase Connection</button>
        <button onclick="testAuth()">Test Authentication</button>
        <button onclick="testProjects()">Test Load Projects</button>
        <button onclick="goToRealDashboard()">Go to Real Dashboard</button>
    </div>

    <!-- Load scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="supabase-client.js"></script>

    <script>
        let resultsDiv = document.getElementById('results');
        let statusDiv = document.getElementById('status');

        async function init() {
            try {
                statusDiv.innerHTML = '⏳ Initializing Supabase...';
                await supabaseClient.init();

                const user = supabaseClient.getUser();

                if (user) {
                    statusDiv.innerHTML = `✅ <strong>Logged in as:</strong> ${user.email}`;
                } else {
                    statusDiv.innerHTML = '❌ <strong>Not logged in</strong>';
                }
            } catch (error) {
                statusDiv.innerHTML = `❌ <strong>Error:</strong> ${error.message}`;
            }
        }

        async function testSupabaseConnection() {
            try {
                addResult('Testing Supabase connection...', 'info');

                const { data, error } = await supabaseClient.client
                    .from('projects')
                    .select('count')
                    .limit(1);

                if (error) throw error;

                addResult('✅ Supabase connection successful!', 'success');
            } catch (error) {
                addResult(`❌ Supabase connection failed: ${error.message}`, 'error');
            }
        }

        async function testAuth() {
            try {
                addResult('Testing authentication...', 'info');

                const user = supabaseClient.getUser();

                if (user) {
                    addResult(`✅ User authenticated: ${user.email}`, 'success');
                    addResult(`User ID: ${user.id}`, 'info');
                } else {
                    addResult('❌ No user found - not authenticated', 'error');
                    addResult('Try logging in first from the main page', 'info');
                }
            } catch (error) {
                addResult(`❌ Auth test failed: ${error.message}`, 'error');
            }
        }

        async function testProjects() {
            try {
                addResult('Loading projects...', 'info');

                const user = supabaseClient.getUser();

                if (!user) {
                    addResult('❌ Must be logged in to load projects', 'error');
                    return;
                }

                const { data: projects, error } = await supabaseClient.client
                    .from('projects')
                    .select('*')
                    .eq('user_id', user.id);

                if (error) throw error;

                addResult(`✅ Found ${projects.length} projects`, 'success');

                if (projects.length > 0) {
                    projects.forEach(p => {
                        addResult(`Project: ${p.name || 'Untitled'} (${p.plan})`, 'info');
                    });
                }
            } catch (error) {
                addResult(`❌ Load projects failed: ${error.message}`, 'error');
            }
        }

        function goToRealDashboard() {
            window.location.href = '/dashboard.html';
        }

        function addResult(message, type) {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = message;
            resultsDiv.appendChild(div);
        }

        // Initialize on load
        init();
    </script>
</body>
</html>

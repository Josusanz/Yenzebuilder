<!DOCTYPE html>
<html>
<head>
    <title>Test Subdomain System</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Test Subdomain System</h1>
    <button onclick="checkProjects()">Check Projects with Subdomain Slugs</button>
    <pre id="output"></pre>

    <script>
        const supabase = window.supabase.createClient(
            'https://xssdcphepracobbsvqmg.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhzc2RjcGhlcHJhY29iYnN2cW1nIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjM2MTA3MDYsImV4cCI6MjA3OTE4NjcwNn0.Z3w9P2dMeNu2J-2AcnxhLVSF_p794JZgIcAKMqkT3-A'
        );

        async function checkProjects() {
            const output = document.getElementById('output');
            output.textContent = 'Checking...';

            const { data, error } = await supabase
                .from('projects')
                .select('id, name, subdomain_slug, published_url')
                .order('created_at', { ascending: false })
                .limit(10);

            if (error) {
                output.textContent = 'Error: ' + JSON.stringify(error, null, 2);
            } else {
                output.textContent = JSON.stringify(data, null, 2);
            }
        }
    </script>
</body>
</html>

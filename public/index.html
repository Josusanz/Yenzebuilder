<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YENZE - Loading...</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>Loading YENZE...</p>
    </div>

    <script>
        (function() {
            const hostname = window.location.hostname;
            const subdomain = hostname.split('.')[0];
            const searchParams = window.location.search;
            let redirectTo = null;

            console.log('[Router] Hostname:', hostname, 'Subdomain:', subdomain);

            // Route builder subdomain to builder.html
            if (hostname === 'builder.yenze.io' ||
                (hostname.includes('vercel.app') && subdomain === 'builder')) {
                redirectTo = '/builder.html' + searchParams;
            }
            // Route main domain to landing page
            else if (hostname === 'yenze.io' ||
                     hostname === 'www.yenze.io' ||
                     hostname.includes('vercel.app')) {
                redirectTo = '/landing.html';
            }

            if (redirectTo) {
                console.log('[Router] Redirecting to:', redirectTo);
                window.location.replace(redirectTo);
            } else {
                console.error('[Router] No route found for hostname:', hostname);
                document.body.innerHTML = '<div class="loader"><h1>❌ Invalid Domain</h1><p>This domain is not configured.</p></div>';
            }
        })();
    </script>
</body>
</html>

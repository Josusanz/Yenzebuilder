<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>YENZE - Visual HTML Editor</title>
    <!-- Subdomain Router -->
    <script>
        (function () {
            const hostname = window.location.hostname;
            const subdomain = hostname.split('.')[0];
            const isSubdomain = hostname.includes('.yenze.io') && subdomain !== 'www' && subdomain !== 'yenze' && subdomain !== 'builder' && !hostname.startsWith('yenze.io');
            if (isSubdomain) {
                document.write('<style>body{margin:0;padding:0;display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:white;font-size:20px}</style>');
                document.write('<div>Loading your website...</div>');
                document.close();
                fetch('/api/subdomain').then(r => r.ok ? r.text() : Promise.reject()).then(h => { document.open(); document.write(h); document.close(); }).catch(() => { document.open(); document.write('404 Not Found'); document.close(); });
                throw new Error('Subdomain routing');
            }
        })();
    </script>

    <script src="https://cdn.tailwindcss.com?plugins=forms,typography"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="properties-panel.css">
    <!-- Keep existing CSS if needed for app.js generated content -->

    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#3B82F6",
                        "background-light": "#FFFFFF",
                        "background-dark": "#121212",
                        "panel-light": "#F9FAFB",
                        "panel-dark": "#1E1E1E",
                        "border-light": "#E5E7EB",
                        "border-dark": "#2D2D2D",
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                        serif: ["Playfair Display", "serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.375rem",
                    }
                },
            },
        };
    </script>
    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #D1D5DB;
            border-radius: 3px;
        }

        .dark ::-webkit-scrollbar-thumb {
            background: #4B5563;
        }

        .canvas-grid {
            background-size: 20px 20px;
            background-image: linear-gradient(to right, rgba(0, 0, 0, 0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
        }

        .dark .canvas-grid {
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        }

        /* App.js compatibility styles */
        .layer-item {
            padding: 8px 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #374151;
            border-radius: 4px;
        }

        .layer-item:hover {
            background: #F3F4F6;
        }

        .layer-item.active {
            background: #E0F2FE;
            color: #0284C7;
        }

        .dark .layer-item {
            color: #D1D5DB;
        }

        .dark .layer-item:hover {
            background: #374151;
        }

        .dark .layer-item.active {
            background: #1E3A8A;
            color: #60A5FA;
        }

        /* Iframe Canvas */
        iframe#canvas {
            border: none;
            width: 100%;
            height: 100%;
            background: white;
        }

        /* Tab Panels */
        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }
    </style>
</head>

<body
    class="bg-background-light dark:bg-background-dark text-gray-900 dark:text-gray-100 font-sans antialiased h-screen flex flex-col overflow-hidden">

    <!-- HEADER -->
    <header
        class="h-14 bg-background-light dark:bg-panel-dark border-b border-border-light dark:border-border-dark flex items-center justify-between px-4 shrink-0 z-50">
        <div class="flex items-center space-x-4">
            <a href="/dashboard.html"
                class="flex items-center justify-center w-8 h-8 bg-gray-900 dark:bg-white text-white dark:text-black rounded-lg">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                    stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
            </a>
            <div class="project-name">
                <input id="projectName" type="text" value="My Awesome Site"
                    class="bg-transparent border-none text-sm font-medium hover:bg-gray-100 dark:hover:bg-gray-800 px-2 py-1 rounded focus:ring-1 focus:ring-primary">
            </div>
        </div>

        <div
            class="absolute left-1/2 transform -translate-x-1/2 bg-gray-100 dark:bg-gray-800 rounded-lg p-1 flex space-x-1">
            <button id="viewDesktop"
                class="device-btn active p-1.5 rounded bg-white dark:bg-gray-700 shadow-sm text-primary"
                onclick="app.setDevice('desktop')">
                <i class="fa-solid fa-desktop"></i>
            </button>
            <button id="viewTablet"
                class="device-btn p-1.5 rounded hover:bg-white dark:hover:bg-gray-700 hover:shadow-sm text-gray-500 transition-all"
                onclick="app.setDevice('tablet')">
                <i class="fa-solid fa-tablet-screen-button"></i>
            </button>
            <button id="viewMobile"
                class="device-btn p-1.5 rounded hover:bg-white dark:hover:bg-gray-700 hover:shadow-sm text-gray-500 transition-all"
                onclick="app.setDevice('mobile')">
                <i class="fa-solid fa-mobile-screen-button"></i>
            </button>
        </div>

        <div class="flex items-center space-x-3">
            <span class="text-xs text-gray-500 dark:text-gray-400 hidden sm:block" id="saveStatus">Draft Saved</span>
            <button id="undoBtn"
                class="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center hover:bg-gray-200 transition"
                onclick="app.undo()">
                <i class="fa-solid fa-rotate-left text-xs"></i>
            </button>
            <button id="redoBtn"
                class="w-8 h-8 rounded-full bg-gray-100 dark:bg-gray-800 flex items-center justify-center hover:bg-gray-200 transition"
                onclick="app.redo()">
                <i class="fa-solid fa-rotate-right text-xs"></i>
            </button>
            <div class="h-6 w-px bg-gray-200 dark:bg-gray-700"></div>
            <button id="publishBtn"
                class="bg-primary hover:bg-blue-600 text-white px-4 py-1.5 rounded text-sm font-medium shadow-sm transition-colors"
                onclick="app.publish()">
                Publish
            </button>
            <div id="userProfileContainer"></div>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <!-- LEFT SIDEBAR -->
        <aside
            class="w-64 bg-panel-light dark:bg-panel-dark border-r border-border-light dark:border-border-dark flex flex-col shrink-0">
            <div class="flex items-center p-2 space-x-1 sidebar-tabs">
                <button
                    class="sidebar-tab flex-1 py-1.5 text-xs font-medium text-center rounded hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500 dark:text-gray-400"
                    data-tab="load">Load</button>
                <button
                    class="sidebar-tab active flex-1 py-1.5 text-xs font-medium text-center rounded bg-gray-200 dark:bg-gray-700 text-gray-900 dark:text-white"
                    data-tab="layers">Layers</button>
                <button
                    class="sidebar-tab flex-1 py-1.5 text-xs font-medium text-center rounded hover:bg-gray-100 dark:hover:bg-gray-800 text-gray-500 dark:text-gray-400"
                    data-tab="elements">Elements</button>
            </div>

            <!-- SEARCH -->
            <div class="px-3 pb-3">
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-2 text-gray-400">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round"
                                stroke-linejoin="round" stroke-width="2"></path>
                        </svg>
                    </span>
                    <input
                        class="w-full bg-white dark:bg-black border border-border-light dark:border-gray-700 rounded py-1.5 pl-8 pr-2 text-xs text-gray-900 dark:text-white"
                        placeholder="Search..." type="text" />
                </div>
            </div>

            <!-- CONTENT -->
            <div class="flex-1 overflow-y-auto px-2 pb-4 space-y-0.5">
                <!-- Load Tab -->
                <div id="loadTab" class="tab-panel">
                    <div class="p-3">
                        <p class="text-xs text-gray-500 dark:text-gray-400 mb-3 leading-relaxed">
                            Paste your HTML code from AI or any other source
                        </p>
                        <textarea id="htmlPaste" placeholder="Paste your HTML code here..."
                            class="w-full h-48 p-3 text-xs font-mono border border-gray-200 dark:border-gray-700 rounded-lg bg-white dark:bg-black text-gray-900 dark:text-gray-100 resize-vertical focus:ring-2 focus:ring-primary focus:border-transparent"></textarea>
                        <button id="loadHtmlBtn"
                            class="w-full mt-3 px-4 py-2.5 bg-primary hover:bg-blue-600 text-white text-sm font-semibold rounded-lg transition-colors">
                            Load HTML
                        </button>

                        <div class="mt-4 pt-4 border-t border-gray-200 dark:border-gray-700">
                            <p class="text-xs text-gray-500 dark:text-gray-400 mb-2">Or import from file:</p>
                            <button onclick="document.getElementById('htmlFileInput').click()"
                                class="w-full px-4 py-2 bg-gray-100 dark:bg-gray-800 hover:bg-gray-200 dark:hover:bg-gray-700 text-gray-900 dark:text-gray-100 text-sm font-medium rounded-lg transition-colors flex items-center justify-center gap-2">
                                <i class="fa-solid fa-upload text-xs"></i>
                                Import HTML File
                            </button>
                            <input type="file" id="htmlFileInput" accept=".html,.htm" style="display: none;">
                        </div>

                        <div class="mt-4 pt-4 border-t border-gray-200 dark:border-gray-700">
                            <p class="text-xs text-gray-500 dark:text-gray-400 mb-2">Need help creating HTML?</p>
                            <a href="/prompt-generator.html"
                                class="w-full px-4 py-2 bg-gradient-to-r from-purple-500 to-pink-500 hover:from-purple-600 hover:to-pink-600 text-white text-sm font-medium rounded-lg transition-all flex items-center justify-center gap-2">
                                <i class="fa-solid fa-wand-magic-sparkles text-xs"></i>
                                AI Prompt Generator
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Layers Tab -->
                <div id="layersTab" class="tab-panel active">
                    <div id="layersContainer" class="space-y-1">
                        <!-- App.js will populate this -->
                    </div>
                </div>

                <!-- Elements Tab -->
                <div id="elementsTab" class="tab-panel">
                    <div id="elementsGrid" class="grid grid-cols-2 gap-2"></div>
                </div>
            </div>
        </aside>

        <!-- CENTER CANVAS -->
        <section
            class="flex-1 bg-gray-50 dark:bg-gray-900 overflow-hidden relative flex flex-col items-center justify-center p-8">
            <div class="absolute inset-0 canvas-grid pointer-events-none z-0"></div>


            <!-- Canvas Wrapper -->
            <div id="canvasWrapper"
                class="relative bg-white dark:bg-black shadow-premium border border-gray-200 dark:border-gray-800 transition-all duration-300 flex flex-col"
                style="width: 100%; height: 100%; max-width: 1440px;">
                <!-- Top Bar of Canvas (Simulated Browser) -->
                <div
                    class="h-6 bg-gray-100 dark:bg-gray-800 border-b border-gray-200 dark:border-gray-700 flex items-center px-4 space-x-1.5">
                    <div class="w-2.5 h-2.5 rounded-full bg-red-400"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-yellow-400"></div>
                    <div class="w-2.5 h-2.5 rounded-full bg-green-400"></div>
                </div>

                <!-- The Iframe -->
                <div class="flex-1 relative bg-white">
                    <iframe id="canvas" src="about:blank"></iframe>
                </div>
            </div>
        </section>

        <!-- RIGHT SIDEBAR (Properties) -->
        <aside
            class="w-72 bg-panel-light dark:bg-panel-dark border-l border-border-light dark:border-border-dark flex flex-col shrink-0">
            <div class="flex border-b border-border-light dark:border-border-dark">
                <button
                    class="flex-1 py-3 text-xs font-semibold text-gray-900 dark:text-white border-b-2 border-primary">Properties</button>
            </div>

            <div id="propertiesPanel" class="flex-1 overflow-y-auto p-4 space-y-4">
                <div class="text-center text-gray-500 text-sm mt-10">Select an element to edit properties</div>
            </div>
        </aside>

    </main>

    <!-- Core Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://js.stripe.com/v3/"></script>
    <script src="/config.secure.js?v=2.0.0"></script>
    <script src="/supabase-client.js?v=1.9.1"></script>
    <script src="/stripe-integration.js?v=1.5.0"></script>
    <script src="/pricing-plans.js?v=1.5.0"></script>
    <script src="/usage-tracker.js?v=1.5.0"></script>
    <script src="/pricing-modal.js?v=1.5.0"></script>
    <script src="/subdomain-utils.js?v=1.5.0"></script>
    <script src="/auth-ui.js?v=1.5.3"></script>
    <!-- <script src="/builder-pages.js?v=1.0.0"></script> --> <!-- DISABLED: Multi-page system -->
    <script src="/app.js?v=1.7.5"></script>

    <!-- Tab Switching Logic (shim for app.js) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const tabs = document.querySelectorAll('.sidebar-tab');
            const panels = document.querySelectorAll('.tab-panel');

            tabs.forEach(tab => {
                tab.addEventListener('click', () => {
                    tabs.forEach(t => t.classList.remove('active', 'bg-gray-200', 'dark:bg-gray-700', 'text-gray-900', 'dark:text-white'));
                    tabs.forEach(t => {
                        if (t !== tab) t.classList.add('hover:bg-gray-100', 'dark:hover:bg-gray-800', 'text-gray-500', 'dark:text-gray-400');
                    });

                    tab.classList.add('active', 'bg-gray-200', 'dark:bg-gray-700', 'text-gray-900', 'dark:text-white');
                    tab.classList.remove('text-gray-500', 'dark:text-gray-400');

                    const target = tab.dataset.tab;
                    panels.forEach(p => p.classList.remove('active'));

                    // Load, Layers, and Elements tabs
                    if (target === 'load') document.getElementById('loadTab').classList.add('active');
                    if (target === 'layers') document.getElementById('layersTab').classList.add('active');
                    if (target === 'elements') document.getElementById('elementsTab').classList.add('active');
                });
            });
        });
    </script>

</body>

</html>

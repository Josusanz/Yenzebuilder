<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YENZE - View Project</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f5f5;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            flex-direction: column;
            gap: 20px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            display: none;
            text-align: center;
            padding: 40px;
            max-width: 600px;
            margin: 100px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .error h1 {
            color: #dc2626;
            margin-bottom: 10px;
        }

        .error p {
            color: #666;
            margin-bottom: 20px;
        }

        .error a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        #projectContent {
            display: none;
            width: 100%;
            height: 100vh;
            border: none;
        }

        .badge {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
            text-decoration: none;
            z-index: 99999;
            transition: transform 0.2s;
        }

        .badge:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(102, 126, 234, 0.5);
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Loading project...</p>
    </div>

    <div class="error" id="error">
        <h1>Project Not Found</h1>
        <p>The project you're looking for doesn't exist or has been removed.</p>
        <a href="/">Go back to YENZE Builder</a>
    </div>

    <iframe id="projectContent"></iframe>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="supabase-client.js"></script>
    <script src="analytics.js"></script>

    <script>
        // Get project ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const projectId = urlParams.get('id');

        async function loadProject() {
            if (!projectId) {
                showError();
                return;
            }

            try {
                // Initialize Supabase client
                await supabaseClient.init();

                // Fetch project from database
                const { data: project, error } = await supabaseClient.client
                    .from('projects')
                    .select('*')
                    .eq('id', projectId)
                    .single();

                if (error || !project) {
                    showError();
                    return;
                }

                // Track page view for analytics
                try {
                    await analyticsTracker.trackPageView(projectId);
                } catch (analyticsError) {
                    console.error('Analytics tracking failed:', analyticsError);
                    // Don't block page load if analytics fails
                }

                // Display the HTML content
                const iframe = document.getElementById('projectContent');
                const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;

                iframeDoc.open();
                iframeDoc.write(project.html);
                iframeDoc.close();

                // Show the iframe
                document.getElementById('loading').style.display = 'none';
                iframe.style.display = 'block';

                // Add badge for free tier
                if (project.plan === 'free') {
                    const badge = document.createElement('a');
                    badge.className = 'badge';
                    badge.href = '/';
                    badge.target = '_blank';
                    badge.textContent = 'Made with YENZE ⚡';
                    document.body.appendChild(badge);
                }

            } catch (err) {
                console.error('Error loading project:', err);
                showError();
            }
        }

        function showError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
        }

        // Load project on page load
        loadProject();
    </script>
</body>
</html>

            color: #0F172A;
            text-decoration: none;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #0F172A;
            color: white;
        }

            background: #000;
        }

        .btn-secondary {
            background: white;
            color: #0F172A;
            border: 1px solid #E2E8F0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 48px 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .header h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .header p {
            font-size: 18px;
            color: #64748B;
        }

        .filter-tabs {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 48px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 10px 20px;
            border-radius: 8px;
            background: white;
            border: 1px solid #E2E8F0;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab:hover {
            border-color: #0066FF;
        }

        .tab.active {
            background: #0F172A;
            color: white;
            border-color: #0F172A;
        }

        .mini-tab {
            padding: 6px 12px;
            border-radius: 6px;
            background: white;
            border: 1px solid #E2E8F0;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .mini-tab:hover {
            border-color: #0066FF;
            background: #F0F7FF;
        }

        .mini-tab.active {
            background: #0066FF;
            color: white;
            border-color: #0066FF;
        }

        .templates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 32px;
        }

        .template-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #E2E8F0;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .template-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.1);
            border-color: #0066FF;
        }

        .template-preview {
            width: 100%;
            height: 250px;
            background: #f1f5f9;
            position: relative;
            overflow: hidden;
        }

        .template-preview iframe {
            width: 333.33%;
            height: 333.33%;
            border: none;
            pointer-events: none;
            transform: scale(0.3);
            transform-origin: 0 0;
        }

        .template-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.95);
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-free {
            color: #10B981;
        }

        .badge-premium {
            background: linear-gradient(135deg, #F59E0B, #D97706);
            color: white;
        }

        .template-info {
            padding: 20px;
        }

        .template-info h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .template-info p {
            font-size: 14px;
            color: #64748B;
            margin-bottom: 16px;
        }

        .template-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .template-price {
            font-size: 20px;
            font-weight: 800;
            color: #0F172A;
        }

        .template-actions {
            display: flex;
            gap: 8px;
        }

        @media (max-width: 768px) {
            .templates-grid {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 32px;
            }
        }

        // Active filters state
        const activeFilters = {
            category: 'all',
            color: 'all',
            style: 'all',
            pricing: 'all',
            features: [],
            search: ''
        };

        // Render templates with advanced filtering
        function renderTemplates() {
            const grid = document.getElementById('templatesGrid');

            // Apply all filters
            let filtered = templates.filter(template => {
                // Search filter
                if (activeFilters.search) {
                    const searchTerm = activeFilters.search.toLowerCase();
                    const matchesSearch =
                        template.name.toLowerCase().includes(searchTerm) ||
                        template.description.toLowerCase().includes(searchTerm) ||
                        template.category.toLowerCase().includes(searchTerm);
                    if (!matchesSearch) return false;
                }

                // Category filter
                if (activeFilters.category !== 'all' && template.category !== activeFilters.category) {
                    return false;
                }

                // Color filter
                if (activeFilters.color !== 'all' && !template.colors.includes(activeFilters.color)) {
                    return false;
                }

                // Style filter
                if (activeFilters.style !== 'all' && template.style !== activeFilters.style) {
                    return false;
                }

                // Pricing filter
                if (activeFilters.pricing !== 'all') {
                    if (activeFilters.pricing === 'free' && template.isPremium) return false;
                    if (activeFilters.pricing === 'premium' && !template.isPremium) return false;
                }

                // Features filter (must have ALL selected features)
                if (activeFilters.features.length > 0) {
                    const hasAllFeatures = activeFilters.features.every(feature =>
                        template.features.includes(feature)
                    );
                    if (!hasAllFeatures) return false;
                }

                return true;
            });

            // Update results count
            const count = filtered.length;
            document.getElementById('resultsCount').textContent =
                `${count} template${count !== 1 ? 's' : ''}`;

            // Update active filters display
            updateActiveFiltersDisplay();

            // Render grid
            grid.innerHTML = filtered.length === 0
                ? '<div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #64748B;"><div style="font-size: 48px; margin-bottom: 16px;">😕</div><div style="font-size: 18px; font-weight: 600;">No templates found</div><div style="margin-top: 8px;">Try adjusting your filters</div></div>'
                : filtered.map(template => `
                <div class="template-card">
                    <div class="template-preview" id="preview-${template.id}">
                        <div style="width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; color: white; font-size: 14px;">
                            Loading preview...
                        </div>
                        <div class="template-badge ${template.isPremium ? 'badge-premium' : 'badge-free'}">
                            ${template.isPremium ? 'PREMIUM' : 'FREE'}
                        </div>
                    </div>
                    <div class="template-info">
                        <h3>${template.name}</h3>
                        <p>${template.description}</p>
                        <div class="template-footer">
                            <span class="template-price">${template.price}</span>
                            <div style="display: flex; gap: 8px;">
                                <button onclick="viewDemo('${template.id}')" class="btn btn-secondary" style="padding: 8px 16px; font-size: 13px; flex: 1;">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle; margin-right: 4px;">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    Demo
                                </button>
                                <button onclick="selectTemplate('${template.id}', ${template.isPremium})" class="btn ${template.isPremium ? 'btn-secondary' : 'btn-primary'}" style="padding: 8px 16px; font-size: 13px; flex: 1;">
                                    ${template.isPremium ? 'Purchase' : 'Use'} →
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            // Load previews after rendering
            filtered.forEach(template => {
                loadTemplatePreview(template.id);
            });
        }

        // Load individual template preview
        async function loadTemplatePreview(templateId) {
            const previewContainer = document.getElementById(`preview-${templateId}`);

            try {
                console.log(`[Preview] Loading template: ${templateId}`);
                const response = await fetch(`/templates/${templateId}.html?v=20241219-4`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const html = await response.text();
                console.log(`[Preview] Loaded ${html.length} bytes for ${templateId}`);

                if (previewContainer) {
                    // Create iframe with proper scaling
                    const iframe = document.createElement('iframe');
                    iframe.sandbox = 'allow-same-origin allow-scripts';
                    iframe.scrolling = 'no';
                    iframe.style.cssText = 'width: 333.33%; height: 333.33%; border: none; pointer-events: none; transform: scale(0.3); transform-origin: 0 0; position: absolute; top: 0; left: 0;';

                    // Clear container and add iframe
                    previewContainer.innerHTML = '';
                    previewContainer.appendChild(iframe);

                    // Wait for iframe to be ready
                    iframe.onload = () => {
                        console.log(`[Preview] iframe loaded for ${templateId}`);
                    };

                    // Write HTML to iframe
                    const doc = iframe.contentDocument || iframe.contentWindow.document;
                    doc.open();
                    doc.write(html);
                    doc.close();

                    // Re-add badge on top
                    const badge = document.createElement('div');
                    const template = templates.find(t => t.id === templateId);
                    badge.className = template.isPremium ? 'template-badge badge-premium' : 'template-badge badge-free';
                    badge.textContent = template.isPremium ? 'PREMIUM' : 'FREE';
                    badge.style.position = 'absolute';
                    badge.style.top = '12px';
                    badge.style.right = '12px';
                    badge.style.zIndex = '10';
                    previewContainer.appendChild(badge);

                    console.log(`[Preview] ✓ Successfully rendered ${templateId}`);
                }
            } catch (error) {
                console.error(`[Preview] ✗ Failed to load ${templateId}:`, error);
                if (previewContainer) {
                    previewContainer.innerHTML = `
                        <div style="width: 100%; height: 100%; background: #fee; display: flex; align-items: center; justify-content: center; color: #c00; font-size: 12px; text-align: center; padding: 20px;">
                            Failed to load preview<br/>${error.message}
                        </div>
                    `;
                }
            }
        }

        // Update active filters display
        function updateActiveFiltersDisplay() {
            const container = document.getElementById('activeFilters');
            const filters = [];

            if (activeFilters.category !== 'all') {
                filters.push({ type: 'category', value: activeFilters.category });
            }
            if (activeFilters.color !== 'all') {
                filters.push({ type: 'color', value: activeFilters.color });
            }
            if (activeFilters.style !== 'all') {
                filters.push({ type: 'style', value: activeFilters.style });
            }
            activeFilters.features.forEach(feature => {
                filters.push({ type: 'feature', value: feature });
            });

            container.innerHTML = filters.length === 0
                ? '<span style="color: #94A3B8; font-size: 14px;">No filters applied</span>'
                : filters.map(f => `
                    <span style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: #0066FF; color: white; border-radius: 100px; font-size: 13px; font-weight: 600;">
                        ${f.value.replace('-', ' ')}
                        <button onclick="removeFilter('${f.type}', '${f.value}')" style="background: none; border: none; color: white; cursor: pointer; padding: 0; font-size: 16px; line-height: 1;">&times;</button>
                    </span>
                `).join('');
        }

        // Remove individual filter
        function removeFilter(type, value) {
            if (type === 'feature') {
                activeFilters.features = activeFilters.features.filter(f => f !== value);
                // Update button state
                const btn = document.querySelector(`[data-filter-type="feature"][data-filter="${value}"]`);
                if (btn) btn.classList.remove('active');
            } else {
                activeFilters[type] = 'all';
                // Update button state
                document.querySelectorAll(`[data-filter-type="${type}"]`).forEach(t => t.classList.remove('active'));
                const allBtn = document.querySelector(`[data-filter-type="${type}"][data-filter="all"]`);
                if (allBtn) allBtn.classList.add('active');
            }
            renderTemplates();
        }

        // Filter toggle button
        document.getElementById('filterToggle').addEventListener('click', () => {
            const panel = document.getElementById('filtersPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        });

        // Filter tabs - single select for category, color, style, pricing
        document.querySelectorAll('[data-filter-type="category"], [data-filter-type="color"], [data-filter-type="style"], [data-filter-type="pricing"]').forEach(tab => {
            tab.addEventListener('click', () => {
                const filterType = tab.dataset.filterType;
                const filterValue = tab.dataset.filter;

                // Remove active from siblings
                document.querySelectorAll(`[data-filter-type="${filterType}"]`).forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                // Update filter
                activeFilters[filterType] = filterValue;
                renderTemplates();
            });
        });

        // Feature filters - multi-select
        document.querySelectorAll('[data-filter-type="feature"]').forEach(tab => {
            tab.addEventListener('click', () => {
                const feature = tab.dataset.filter;

                if (activeFilters.features.includes(feature)) {
                    // Remove feature
                    activeFilters.features = activeFilters.features.filter(f => f !== feature);
                    tab.classList.remove('active');
                } else {
                    // Add feature
                    activeFilters.features.push(feature);
                    tab.classList.add('active');
                }

                renderTemplates();
            });
        });

        // Search functionality
        const searchInput = document.getElementById('searchInput');
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                activeFilters.search = e.target.value;
                renderTemplates();
            }, 300);
        });

        // View demo in new window
        function viewDemo(templateId) {
            const availableTemplates = ['yenze-modern', 'finwise', 'yenze-ai-agency', 'yenze-cinematic', 'portfolio-digital-architect', 'linktree-creative', 'linktree-business', 'linktree-influencer', 'linktree-creator'];

            if (availableTemplates.includes(templateId)) {
                window.open(`/templates/${templateId}.html?v=20241219-4`, '_blank');
            } else {
                alert('Demo coming soon for this template!');
            }
        }

        // Select template
        async function selectTemplate(templateId, isPremium) {
            const template = templates.find(t => t.id === templateId);

            if (isPremium) {
                // Show purchase modal
                showPurchaseModal(template);
                return;
            }

            if (!template) {
                alert('Template not found!');
                return;
            }

            // Check if this template has an HTML file
            const availableTemplates = ['yenze-modern', 'finwise', 'yenze-ai-agency', 'yenze-cinematic', 'portfolio-digital-architect', 'linktree-creative', 'linktree-business', 'linktree-influencer', 'linktree-creator'];

            if (availableTemplates.includes(templateId)) {
                console.log('[Template Select] Redirecting to builder with template:', templateId);

                // Redirect to builder with template ID - builder will load it directly
                window.location.href = `https://builder.yenze.io?template=${templateId}&templateName=${encodeURIComponent(template.name)}`;
            } else {
                alert('This template is coming soon! Check back later for this design.');
            }
        }

        // Purchase modal
        function showPurchaseModal(template) {
            // Create modal if doesn't exist
            let modal = document.getElementById('purchaseModal');
            if (!modal) {
                modal = document.createElement('div');
                modal.id = 'purchaseModal';
                modal.innerHTML = `
                    <div style="position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px;">
                        <div style="background: white; border-radius: 16px; max-width: 480px; width: 100%; padding: 32px; position: relative; animation: slideUp 0.3s ease;">
                            <button onclick="closePurchaseModal()" style="position: absolute; top: 16px; right: 16px; background: none; border: none; font-size: 24px; cursor: pointer; color: #94A3B8;">&times;</button>

                            <div id="modalContent"></div>
                        </div>
                    </div>
                `;
                document.body.appendChild(modal);
            }

            // Populate content
            document.getElementById('modalContent').innerHTML = `
                <div style="text-align: center; margin-bottom: 24px;">
                    <div style="width: 64px; height: 64px; background: linear-gradient(135deg, #F59E0B, #D97706); border-radius: 16px; display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                            <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
                            <path d="M2 17l10 5 10-5"></path>
                            <path d="M2 12l10 5 10-5"></path>
                        </svg>
                    </div>
                    <h2 style="font-size: 24px; font-weight: 800; margin: 0 0 8px;">${template.name}</h2>
                    <p style="color: #64748B; margin: 0;">${template.description}</p>
                </div>

                <div style="background: #F8FAFC; border-radius: 12px; padding: 20px; margin-bottom: 24px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <span style="font-weight: 600;">Template License</span>
                        <span style="font-size: 28px; font-weight: 800;">${template.price}</span>
                    </div>
                    <ul style="list-style: none; padding: 0; margin: 0; font-size: 14px; color: #64748B;">
                        <li style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2"><path d="M20 6L9 17l-5-5"></path></svg>
                            Lifetime access
                        </li>
                        <li style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2"><path d="M20 6L9 17l-5-5"></path></svg>
                            Use on unlimited projects
                        </li>
                        <li style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2"><path d="M20 6L9 17l-5-5"></path></svg>
                            Download source code
                        </li>
                        <li style="display: flex; align-items: center; gap: 8px;">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2"><path d="M20 6L9 17l-5-5"></path></svg>
                            Free updates
                        </li>
                    </ul>
                </div>

                <button onclick="purchaseTemplate('${template.id}')" style="width: 100%; padding: 16px; background: linear-gradient(135deg, #F59E0B, #D97706); color: white; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: transform 0.2s;" onmouseover="this.style.transform='translateY(-2px)'" onmouseout="this.style.transform='translateY(0)'">
                    Purchase for ${template.price}
                </button>

                <p style="text-align: center; font-size: 12px; color: #94A3B8; margin-top: 16px;">
                    Secure payment via Stripe. 30-day money back guarantee.
                </p>
            `;

            modal.style.display = 'block';
        }

        function closePurchaseModal() {
            const modal = document.getElementById('purchaseModal');
            if (modal) modal.style.display = 'none';
        }

        function purchaseTemplate(templateId) {
            const template = templates.find(t => t.id === templateId);
            if (template && template.buyUrl) {
                window.open(template.buyUrl, '_blank');
            } else {
                // TODO: Create Stripe checkout session
                alert('Payment integration coming soon! Contact us at hello@yenze.io for early access.');
            }
            closePurchaseModal();
        }

        // Close modal on background click
        document.addEventListener('click', (e) => {
            if (e.target.id === 'purchaseModal' || e.target.closest('#purchaseModal > div:first-child') === e.target) {
                closePurchaseModal();
            }
        });

        // Initial render
        renderTemplates();
    </script>

    <style>
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>

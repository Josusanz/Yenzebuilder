<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Templates - YENZE</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #FAFAFA;
            color: #0F172A;
        }

        .nav {
            background: white;
            border-bottom: 1px solid #E2E8F0;
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            color: #0F172A;
            text-decoration: none;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-primary {
            background: #0F172A;
            color: white;
        }

        .btn-primary:hover {
            background: #000;
        }

        .btn-secondary {
            background: white;
            color: #0F172A;
            border: 1px solid #E2E8F0;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 48px 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .header h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 16px;
        }

        .header p {
            font-size: 18px;
            color: #64748B;
        }

        .filter-tabs {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 48px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 10px 20px;
            border-radius: 8px;
            background: white;
            border: 1px solid #E2E8F0;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tab:hover {
            border-color: #0066FF;
        }

        .tab.active {
            background: #0F172A;
            color: white;
            border-color: #0F172A;
        }

        .mini-tab {
            padding: 6px 12px;
            border-radius: 6px;
            background: white;
            border: 1px solid #E2E8F0;
            font-weight: 500;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .mini-tab:hover {
            border-color: #0066FF;
            background: #F0F7FF;
        }

        .mini-tab.active {
            background: #0066FF;
            color: white;
            border-color: #0066FF;
        }

        .templates-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 32px;
        }

        .template-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #E2E8F0;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .template-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.1);
            border-color: #0066FF;
        }

        .template-preview {
            width: 100%;
            height: 250px;
            background: #f1f5f9;
            position: relative;
            overflow: hidden;
        }

        .template-preview iframe {
            width: 333.33%;
            height: 333.33%;
            border: none;
            pointer-events: none;
            transform: scale(0.3);
            transform-origin: 0 0;
        }

        .template-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background: rgba(255, 255, 255, 0.95);
            padding: 4px 12px;
            border-radius: 100px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-free {
            color: #10B981;
        }

        .badge-premium {
            background: linear-gradient(135deg, #F59E0B, #D97706);
            color: white;
        }

        .template-info {
            padding: 20px;
        }

        .template-info h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .template-info p {
            font-size: 14px;
            color: #64748B;
            margin-bottom: 16px;
        }

        .template-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .template-price {
            font-size: 20px;
            font-weight: 800;
            color: #0F172A;
        }

        .template-actions {
            display: flex;
            gap: 8px;
        }

        @media (max-width: 768px) {
            .templates-grid {
                grid-template-columns: 1fr;
            }
            .header h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-content">
            <a href="/" class="logo" style="display: flex; align-items: center; gap: 8px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: #0066FF;">
                    <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                    <polyline points="2 17 12 22 22 17"></polyline>
                    <polyline points="2 12 12 17 22 12"></polyline>
                </svg>
                <span>YENZE</span>
            </a>
            <a href="https://builder.yenze.io" class="btn btn-primary">Back to Builder</a>
        </div>
    </nav>

    <div class="container">
        <!-- Compact Header with Filters -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 16px; flex-wrap: wrap;">
            <div>
                <h1 style="font-size: 24px; font-weight: 800; margin: 0;">Templates</h1>
                <p id="resultsCount" style="font-size: 13px; color: #64748B; margin: 4px 0 0;">9 templates</p>
            </div>

            <!-- Compact Search & Filter Toggle -->
            <div style="display: flex; gap: 10px; align-items: center;">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search..."
                    style="width: 180px; padding: 8px 14px; border-radius: 8px; border: 1px solid #E2E8F0; font-size: 14px; outline: none;"
                />
                <button id="filterToggle" style="padding: 8px 14px; border-radius: 8px; border: 1px solid #E2E8F0; background: white; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="4" y1="6" x2="20" y2="6"></line>
                        <line x1="4" y1="12" x2="20" y2="12"></line>
                        <line x1="4" y1="18" x2="20" y2="18"></line>
                    </svg>
                    Filters
                </button>
            </div>
        </div>

        <!-- Collapsible Filters -->
        <div id="filtersPanel" style="display: none; margin-bottom: 20px; padding: 16px; background: #F8FAFC; border-radius: 10px; border: 1px solid #E2E8F0;">
            <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
                <!-- Category -->
                <div>
                    <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #64748B; margin-bottom: 6px;">Category</div>
                    <div style="display: flex; flex-wrap: wrap; gap: 4px;">
                        <button class="mini-tab active" data-filter-type="category" data-filter="all">All</button>
                        <button class="mini-tab" data-filter-type="category" data-filter="business">Business</button>
                        <button class="mini-tab" data-filter-type="category" data-filter="portfolio">Portfolio</button>
                        <button class="mini-tab" data-filter-type="category" data-filter="landing">Landing</button>
                        <button class="mini-tab" data-filter-type="category" data-filter="linktree">Linktree</button>
                    </div>
                </div>

                <!-- Color -->
                <div>
                    <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #64748B; margin-bottom: 6px;">Color</div>
                    <div style="display: flex; flex-wrap: wrap; gap: 4px;">
                        <button class="mini-tab active" data-filter-type="color" data-filter="all">All</button>
                        <button class="mini-tab" data-filter-type="color" data-filter="dark">Dark</button>
                        <button class="mini-tab" data-filter-type="color" data-filter="light">Light</button>
                        <button class="mini-tab" data-filter-type="color" data-filter="blue">Blue</button>
                        <button class="mini-tab" data-filter-type="color" data-filter="purple">Purple</button>
                    </div>
                </div>

                <!-- Style -->
                <div>
                    <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #64748B; margin-bottom: 6px;">Style</div>
                    <div style="display: flex; flex-wrap: wrap; gap: 4px;">
                        <button class="mini-tab active" data-filter-type="style" data-filter="all">All</button>
                        <button class="mini-tab" data-filter-type="style" data-filter="minimal">Minimal</button>
                        <button class="mini-tab" data-filter-type="style" data-filter="modern">Modern</button>
                        <button class="mini-tab" data-filter-type="style" data-filter="professional">Pro</button>
                        <button class="mini-tab" data-filter-type="style" data-filter="creative">Creative</button>
                    </div>
                </div>

                <!-- Features -->
                <div style="grid-column: 1 / -1;">
                    <div style="font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #64748B; margin-bottom: 6px;">Features</div>
                    <div style="display: flex; flex-wrap: wrap; gap: 4px;">
                        <button class="mini-tab" data-filter-type="feature" data-filter="contact-form">Contact Form</button>
                        <button class="mini-tab" data-filter-type="feature" data-filter="dark-mode">Dark Mode</button>
                        <button class="mini-tab" data-filter-type="feature" data-filter="animations">Animations</button>
                        <button class="mini-tab" data-filter-type="feature" data-filter="responsive">Responsive</button>
                        <button class="mini-tab" data-filter-type="feature" data-filter="glassmorphism">Glassmorphism</button>
                        <button class="mini-tab" data-filter-type="feature" data-filter="newsletter">Newsletter</button>
                    </div>
                </div>
            </div>

            <!-- Active Filters -->
            <div id="activeFilters" style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px solid #E2E8F0;"></div>
        </div>

        <div class="templates-grid" id="templatesGrid">
            <!-- Templates will be loaded here -->
        </div>
    </div>

    <script>
        // Template data with rich metadata
        const templates = [
            {
                id: 'yenze-modern',
                name: 'YENZE Modern',
                description: 'Professional dark theme with AI-powered features and contact form',
                category: 'landing',
                price: 'FREE',
                isPremium: false,
                preview: 'https://images.unsplash.com/photo-1547658719-da2b51169166?w=800&h=600&fit=crop&q=80',
                html: null,
                colors: ['dark', 'blue'],
                style: 'modern',
                features: ['contact-form', 'responsive', 'animations']
            },
            {
                id: 'finwise',
                name: 'FinWise',
                description: 'Modern fintech template with financial dashboard and analytics',
                category: 'business',
                price: 'FREE',
                isPremium: false,
                preview: 'https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?w=800&h=600&fit=crop&q=80',
                html: null,
                colors: ['light', 'blue', 'green'],
                style: 'professional',
                features: ['dashboard', 'charts', 'responsive']
            },
            {
                id: 'yenze-ai-agency',
                name: 'AI Agency Pro',
                description: 'Premium minimal design for AI and tech agencies with elegant layouts',
                category: 'business',
                price: 'FREE',
                isPremium: false,
                preview: 'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=800&h=600&fit=crop&q=80',
                html: null,
                colors: ['light', 'purple'],
                style: 'minimal',
                features: ['newsletter', 'animations', 'responsive']
            },
            {
                id: 'yenze-cinematic',
                name: 'Cinematic Journey',
                description: 'Immersive storytelling template with full-screen sections and contact form',
                category: 'landing',
                price: 'FREE',
                isPremium: false,
                preview: 'https://images.unsplash.com/photo-1579547621415-3754907a9ee0?w=800&h=600&fit=crop&q=80',
                html: null,
                colors: ['multicolor', 'gradient'],
                style: 'creative',
                features: ['fullscreen', 'contact-form', 'animations', 'responsive']
            },
            {
                id: 'portfolio-digital-architect',
                name: 'Digital Architect',
                description: 'Premium portfolio for NFT artists and Web3 creatives with asymmetrical grid',
                category: 'portfolio',
                price: 'FREE',
                isPremium: false,
                preview: 'https://images.unsplash.com/photo-1618005198919-d3d4b5a92ead?w=800&h=600&fit=crop&q=80',
                html: null,
                colors: ['dark', 'orange', 'brown'],
                style: 'creative',
                features: ['grid-layout', 'contact-form', 'animations']
            },
            {
                id: 'linktree-creative',
                name: 'Creative Links',
                description: 'Minimalist linktree-style profile with dark mode and smooth animations',
                category: 'linktree',
                price: 'FREE',
                isPremium: false,
                preview: 'https://images.unsplash.com/photo-1557672172-298e090bd0f1?w=800&h=600&fit=crop&q=80',
                html: null,
                colors: ['dark', 'blue'],
                style: 'minimal',
                features: ['dark-mode', 'contact-form', 'social-links', 'animations']
            },
            {
                id: 'linktree-business',
                name: 'Business Pro',
                description: 'Professional corporate linktree with verified badge and contact form',
                category: 'linktree',
                price: 'FREE',
                isPremium: false,
                preview: 'https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?w=800&h=600&fit=crop&q=80',
                html: null,
                colors: ['light', 'blue'],
                style: 'professional',
                features: ['contact-form', 'verified-badge', 'social-links', 'glassmorphism']
            },
            {
                id: 'linktree-influencer',
                name: 'Influencer Vibes',
                description: 'Vibrant pastel design perfect for lifestyle bloggers and content creators',
                category: 'linktree',
                price: 'FREE',
                isPremium: false,
                preview: 'https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=800&h=600&fit=crop&q=80',
                html: null,
                colors: ['pastel', 'pink', 'multicolor'],
                style: 'playful',
                features: ['newsletter', 'social-links', 'glassmorphism', 'animations']
            },
            {
                id: 'linktree-creator',
                name: 'Content Creator',
                description: 'Bold dark theme with video preview for YouTubers and streamers',
                category: 'linktree',
                price: 'FREE',
                isPremium: false,
                preview: 'https://images.unsplash.com/photo-1626785774573-4b799315345d?w=800&h=600&fit=crop&q=80',
                html: null,
                colors: ['dark', 'gold'],
                style: 'bold',
                features: ['video-preview', 'newsletter', 'social-links', 'dark-mode']
            }
        ];

        // Active filters state
        const activeFilters = {
            category: 'all',
            color: 'all',
            style: 'all',
            features: [],
            search: ''
        };

        // Render templates with advanced filtering
        function renderTemplates() {
            const grid = document.getElementById('templatesGrid');

            // Apply all filters
            let filtered = templates.filter(template => {
                // Search filter
                if (activeFilters.search) {
                    const searchTerm = activeFilters.search.toLowerCase();
                    const matchesSearch =
                        template.name.toLowerCase().includes(searchTerm) ||
                        template.description.toLowerCase().includes(searchTerm) ||
                        template.category.toLowerCase().includes(searchTerm);
                    if (!matchesSearch) return false;
                }

                // Category filter
                if (activeFilters.category !== 'all' && template.category !== activeFilters.category) {
                    return false;
                }

                // Color filter
                if (activeFilters.color !== 'all' && !template.colors.includes(activeFilters.color)) {
                    return false;
                }

                // Style filter
                if (activeFilters.style !== 'all' && template.style !== activeFilters.style) {
                    return false;
                }

                // Features filter (must have ALL selected features)
                if (activeFilters.features.length > 0) {
                    const hasAllFeatures = activeFilters.features.every(feature =>
                        template.features.includes(feature)
                    );
                    if (!hasAllFeatures) return false;
                }

                return true;
            });

            // Update results count
            const count = filtered.length;
            document.getElementById('resultsCount').textContent =
                `${count} template${count !== 1 ? 's' : ''}`;

            // Update active filters display
            updateActiveFiltersDisplay();

            // Render grid
            grid.innerHTML = filtered.length === 0
                ? '<div style="grid-column: 1/-1; text-align: center; padding: 60px 20px; color: #64748B;"><div style="font-size: 48px; margin-bottom: 16px;">😕</div><div style="font-size: 18px; font-weight: 600;">No templates found</div><div style="margin-top: 8px;">Try adjusting your filters</div></div>'
                : filtered.map(template => `
                <div class="template-card">
                    <div class="template-preview" id="preview-${template.id}">
                        <div style="width: 100%; height: 100%; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); display: flex; align-items: center; justify-content: center; color: white; font-size: 14px;">
                            Loading preview...
                        </div>
                        <div class="template-badge ${template.isPremium ? 'badge-premium' : 'badge-free'}">
                            ${template.isPremium ? 'PREMIUM' : 'FREE'}
                        </div>
                    </div>
                    <div class="template-info">
                        <h3>${template.name}</h3>
                        <p>${template.description}</p>
                        <div class="template-footer">
                            <span class="template-price">${template.price}</span>
                            <div style="display: flex; gap: 8px;">
                                <button onclick="viewDemo('${template.id}')" class="btn btn-secondary" style="padding: 8px 16px; font-size: 13px; flex: 1;">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: inline-block; vertical-align: middle; margin-right: 4px;">
                                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    Demo
                                </button>
                                <button onclick="selectTemplate('${template.id}', ${template.isPremium})" class="btn ${template.isPremium ? 'btn-secondary' : 'btn-primary'}" style="padding: 8px 16px; font-size: 13px; flex: 1;">
                                    ${template.isPremium ? 'Purchase' : 'Use'} →
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');

            // Load previews after rendering
            filtered.forEach(template => {
                loadTemplatePreview(template.id);
            });
        }

        // Load individual template preview
        async function loadTemplatePreview(templateId) {
            const previewContainer = document.getElementById(`preview-${templateId}`);

            try {
                console.log(`[Preview] Loading template: ${templateId}`);
                const response = await fetch(`/templates/${templateId}.html?v=20241219-4`);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const html = await response.text();
                console.log(`[Preview] Loaded ${html.length} bytes for ${templateId}`);

                if (previewContainer) {
                    // Create iframe with proper scaling
                    const iframe = document.createElement('iframe');
                    iframe.sandbox = 'allow-same-origin allow-scripts';
                    iframe.scrolling = 'no';
                    iframe.style.cssText = 'width: 333.33%; height: 333.33%; border: none; pointer-events: none; transform: scale(0.3); transform-origin: 0 0; position: absolute; top: 0; left: 0;';

                    // Clear container and add iframe
                    previewContainer.innerHTML = '';
                    previewContainer.appendChild(iframe);

                    // Wait for iframe to be ready
                    iframe.onload = () => {
                        console.log(`[Preview] iframe loaded for ${templateId}`);
                    };

                    // Write HTML to iframe
                    const doc = iframe.contentDocument || iframe.contentWindow.document;
                    doc.open();
                    doc.write(html);
                    doc.close();

                    // Re-add badge on top
                    const badge = document.createElement('div');
                    const template = templates.find(t => t.id === templateId);
                    badge.className = template.isPremium ? 'template-badge badge-premium' : 'template-badge badge-free';
                    badge.textContent = template.isPremium ? 'PREMIUM' : 'FREE';
                    badge.style.position = 'absolute';
                    badge.style.top = '12px';
                    badge.style.right = '12px';
                    badge.style.zIndex = '10';
                    previewContainer.appendChild(badge);

                    console.log(`[Preview] ✓ Successfully rendered ${templateId}`);
                }
            } catch (error) {
                console.error(`[Preview] ✗ Failed to load ${templateId}:`, error);
                if (previewContainer) {
                    previewContainer.innerHTML = `
                        <div style="width: 100%; height: 100%; background: #fee; display: flex; align-items: center; justify-content: center; color: #c00; font-size: 12px; text-align: center; padding: 20px;">
                            Failed to load preview<br/>${error.message}
                        </div>
                    `;
                }
            }
        }

        // Update active filters display
        function updateActiveFiltersDisplay() {
            const container = document.getElementById('activeFilters');
            const filters = [];

            if (activeFilters.category !== 'all') {
                filters.push({ type: 'category', value: activeFilters.category });
            }
            if (activeFilters.color !== 'all') {
                filters.push({ type: 'color', value: activeFilters.color });
            }
            if (activeFilters.style !== 'all') {
                filters.push({ type: 'style', value: activeFilters.style });
            }
            activeFilters.features.forEach(feature => {
                filters.push({ type: 'feature', value: feature });
            });

            container.innerHTML = filters.length === 0
                ? '<span style="color: #94A3B8; font-size: 14px;">No filters applied</span>'
                : filters.map(f => `
                    <span style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; background: #0066FF; color: white; border-radius: 100px; font-size: 13px; font-weight: 600;">
                        ${f.value.replace('-', ' ')}
                        <button onclick="removeFilter('${f.type}', '${f.value}')" style="background: none; border: none; color: white; cursor: pointer; padding: 0; font-size: 16px; line-height: 1;">&times;</button>
                    </span>
                `).join('');
        }

        // Remove individual filter
        function removeFilter(type, value) {
            if (type === 'feature') {
                activeFilters.features = activeFilters.features.filter(f => f !== value);
                // Update button state
                const btn = document.querySelector(`[data-filter-type="feature"][data-filter="${value}"]`);
                if (btn) btn.classList.remove('active');
            } else {
                activeFilters[type] = 'all';
                // Update button state
                document.querySelectorAll(`[data-filter-type="${type}"]`).forEach(t => t.classList.remove('active'));
                const allBtn = document.querySelector(`[data-filter-type="${type}"][data-filter="all"]`);
                if (allBtn) allBtn.classList.add('active');
            }
            renderTemplates();
        }

        // Filter toggle button
        document.getElementById('filterToggle').addEventListener('click', () => {
            const panel = document.getElementById('filtersPanel');
            panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
        });

        // Filter tabs - single select for category, color, style
        document.querySelectorAll('[data-filter-type="category"], [data-filter-type="color"], [data-filter-type="style"]').forEach(tab => {
            tab.addEventListener('click', () => {
                const filterType = tab.dataset.filterType;
                const filterValue = tab.dataset.filter;

                // Remove active from siblings
                document.querySelectorAll(`[data-filter-type="${filterType}"]`).forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                // Update filter
                activeFilters[filterType] = filterValue;
                renderTemplates();
            });
        });

        // Feature filters - multi-select
        document.querySelectorAll('[data-filter-type="feature"]').forEach(tab => {
            tab.addEventListener('click', () => {
                const feature = tab.dataset.filter;

                if (activeFilters.features.includes(feature)) {
                    // Remove feature
                    activeFilters.features = activeFilters.features.filter(f => f !== feature);
                    tab.classList.remove('active');
                } else {
                    // Add feature
                    activeFilters.features.push(feature);
                    tab.classList.add('active');
                }

                renderTemplates();
            });
        });

        // Search functionality
        const searchInput = document.getElementById('searchInput');
        let searchTimeout;
        searchInput.addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                activeFilters.search = e.target.value;
                renderTemplates();
            }, 300);
        });

        // View demo in new window
        function viewDemo(templateId) {
            const availableTemplates = ['yenze-modern', 'finwise', 'yenze-ai-agency', 'yenze-cinematic', 'portfolio-digital-architect', 'linktree-creative', 'linktree-business', 'linktree-influencer', 'linktree-creator'];

            if (availableTemplates.includes(templateId)) {
                window.open(`/templates/${templateId}.html?v=20241219-4`, '_blank');
            } else {
                alert('Demo coming soon for this template!');
            }
        }

        // Select template
        async function selectTemplate(templateId, isPremium) {
            const template = templates.find(t => t.id === templateId);

            if (isPremium) {
                alert('Premium templates require a paid plan. Redirect to checkout coming soon!');
                return;
            }

            if (!template) {
                alert('Template not found!');
                return;
            }

            // Check if this template has an HTML file
            const availableTemplates = ['yenze-modern', 'finwise', 'yenze-ai-agency', 'yenze-cinematic', 'portfolio-digital-architect', 'linktree-creative', 'linktree-business', 'linktree-influencer', 'linktree-creator'];

            if (availableTemplates.includes(templateId)) {
                console.log('[Template Select] Redirecting to builder with template:', templateId);

                // Redirect to builder with template ID - builder will load it directly
                window.location.href = `https://builder.yenze.io?template=${templateId}&templateName=${encodeURIComponent(template.name)}`;
            } else {
                alert('This template is coming soon! Check back later for this design.');
            }
        }

        // Initial render
        renderTemplates();
    </script>
</body>
</html>
